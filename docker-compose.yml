# Corazium WAAP — full stack. Every component ships as its own image so each
# can be scaled/deployed independently (frontend, control plane, databases).
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # REST base URL of the control plane, server + browser side
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      controlplane:
        condition: service_healthy

  controlplane:
    build: ./backend
    ports:
      - "8080:8080" # REST API
      - "9090:9090" # gRPC NodeControl (mTLS in prod)
    environment:
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - DATABASE_URL=postgres://corazium:corazium@postgres:5432/corazium?sslmode=disable
      - CLICKHOUSE_ADDR=clickhouse:9000
      - REDIS_ADDR=redis:6379
      - WEB_ORIGIN=http://localhost:3000
      - SEED_DEMO=true
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=corazium
      - POSTGRES_PASSWORD=corazium
      - POSTGRES_DB=corazium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corazium"]
      interval: 5s
      timeout: 3s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./backend/migrations/clickhouse_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  chdata:
  redisdata:
